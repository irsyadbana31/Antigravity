name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    name: Compile Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/KuatoDev.jks
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore app/KuatoDev.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias turbo \
              -storepass turbotest123 \
              -keypass turbotest123 \
              -dname "CN=Antigravity Turbo, OU=Dev, O=Turbo, L=ID, S=ID, C=ID"
            echo "SIGNING_STORE_PASSWORD=turbotest123" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=turbo" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=turbotest123" >> $GITHUB_ENV
          fi

      - name: Compile Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
