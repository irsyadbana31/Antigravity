name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    name: Compile Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain (Android Targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_turbo

      - name: Build Rust Native Engine (libantigravity_turbo.so)
        working-directory: rust_turbo
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "Using Android NDK toolchain at: $TOOLCHAIN"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$TOOLCHAIN/llvm-ar"
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/armeabi-v7a
          cp target/aarch64-linux-android/release/libantigravity_turbo.so ../app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libantigravity_turbo.so ../app/src/main/jniLibs/armeabi-v7a/
          ls -lh ../app/src/main/jniLibs/arm64-v8a/libantigravity_turbo.so ../app/src/main/jniLibs/armeabi-v7a/libantigravity_turbo.so

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/KuatoDev.jks
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore app/KuatoDev.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias turbo \
              -storepass turbotest123 \
              -keypass turbotest123 \
              -dname "CN=Antigravity Turbo, OU=Dev, O=Turbo, L=ID, S=ID, C=ID"
            echo "SIGNING_STORE_PASSWORD=turbotest123" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=turbo" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=turbotest123" >> $GITHUB_ENV
          fi

      - name: Compile Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Antigravity-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
